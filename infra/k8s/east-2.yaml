apiVersion: v1
kind: Service
metadata:
  name: east-2
spec:
  selector:
    app.kubernetes.io/name: east-2
  ports:
  - name: p-6379
    port: 6379
    targetPort: 6379
  - name: p-16379
    port: 16379
    targetPort: 16379
  clusterIP: None
  publishNotReadyAddresses: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: east-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: east-2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: east-2
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - name: east-2
        image: redis:7.4-alpine
        env:
        - name: REGION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lab-credentials
              key: REDIS_EAST_PASSWORD
        - name: NODE_NAME
          value: east-2
        command:
        - sh
        - /config/redis.sh
        volumeMounts:
        - name: data
          mountPath: /data
        - name: scripts
          mountPath: /config/redis.sh
          subPath: redis.sh
          readOnly: true
        ports:
        - containerPort: 6379
        - containerPort: 16379
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - REDISCLI_AUTH="$REGION_PASSWORD" redis-cli ping | grep -q PONG
          periodSeconds: 12
          timeoutSeconds: 8
      volumes:
      - name: scripts
        configMap:
          name: lab-scripts
          defaultMode: 365
  serviceName: east-2
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
